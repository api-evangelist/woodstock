description: Woodstock (Woodstock K.K., Tokyo) is a Japanese investment platform
  offering zero-commission, 24-hour US stock trading in JPY with fractional shares
  down to 0.0001-share increments. A Financial Products Intermediary registered
  with the Kanto Financial Bureau (No. 965), with customer assets held by
  affiliated broker AlpacaJapan, Woodstock's programmatic surface is a hosted
  Model Context Protocol server that lets AI agents like Claude, ChatGPT, and
  Grok manage portfolios, research US stocks, and place real trades after OAuth
  plus passkey authorization. Backed by Kindred Ventures, Coinbase, and Sony.
